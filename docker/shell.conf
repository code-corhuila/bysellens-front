server {
  listen 80;
  root /usr/share/nginx/html;
  location = /health { access_log off; return 200 'ok'; }
  location /clientes { proxy_pass http://customer:80; }
  location /inventario { proxy_pass http://inventory:80; }
  location /productos { proxy_pass http://product:80; }
  location /ventas { proxy_pass http://sales:80; }
  location /mfe/customer/ { proxy_pass http://customer:80; }
  location /mfe/inventory/ { proxy_pass http://inventory:80; }
  location /mfe/product/ { proxy_pass http://product:80; }
  location /mfe/sales/ { proxy_pass http://sales:80; }
  location / { try_files $uri $uri/ /index.html; }
}
